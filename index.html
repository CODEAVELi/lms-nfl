<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LMS NFL 2026 – $390,000 Last Man Standing</title>
  <meta name="description" content="Follow the 2026 Last Man Standing NFL league: $390,000 prize, weekly picks, live scores and surviving entries." />

  <!-- Pixel fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tecmo: {
              navy: '#0b1021',
              blue: '#0d6cf2',
              green: '#3cbc0d',
              gold: '#f8b800',
              red: '#e40058',
              white: '#f5f7ff',
              gray: '#9aa2b1',
              field: '#1c7c2a',
              shadow: '#05070f'
            }
          },
          fontFamily: {
            pixel: ['"Press Start 2P"', 'ui-sans-serif', 'system-ui', 'sans-serif'],

  <meta name="color-scheme" content="light dark" />
  <style>
    html,body { height:100%; }
    :root {
      --tecmo-navy: #0b1021;
      --tecmo-background: #121a36;
      --tecmo-surface: #0a0f1f;
      --tecmo-blue: #0d6cf2;
      --tecmo-green: #3cbc0d;
      --tecmo-gold: #f8b800;
      --tecmo-red: #e40058;
      --tecmo-white: #f5f7ff;
      --tecmo-shadow: #05070f;
      --tecmo-outline: #0b1021;
    }
    html { scroll-padding-top:110px; }
    .status-definition { font-size:14px; margin:-10px 0 20px; }
    .app-shell .team-chip { font:700 11px/1 system-ui,sans-serif; }
    body.tecmo {
      background-color: var(--tecmo-background);
      color: var(--tecmo-white);
    }
    /* Subtle pixel grid + blue wash */
    .grid-bg {
      background-color: var(--tecmo-background);
      background-image:
        repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0, rgba(255,255,255,0.035) 1px, transparent 1px, transparent 8px),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.035) 0, rgba(255,255,255,0.035) 1px, transparent 1px, transparent 8px);
    }
    .pixel-font { font-family: "Press Start 2P", ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.5px; }
    .pixel-mono { font-family: "VT323", ui-monospace, SFMono-Regular, monospace; font-size: 1.05rem; }
    .sprite { image-rendering: pixelated; image-rendering: crisp-edges; }
    .team-logo { width: 20px; height: 16px; position: relative; display: inline-flex; align-items: center; justify-content: center; }
    .team-logo img { max-width: 100%; max-height: 100%; image-rendering: pixelated; }
    .team-chip { width: 20px; height: 16px; border: 2px solid var(--tecmo-white); background: #0e142a; color: var(--tecmo-white); box-shadow: 0 0 0 2px var(--tecmo-shadow), inset 0 0 0 1px rgba(255,255,255,0.15); display: inline-flex; align-items: center; justify-content: center; font-family: "Press Start 2P", ui-sans-serif, system-ui, sans-serif; font-size: 9px; line-height: 1; }
    .panel-8bit {
      --panel-fill: var(--tecmo-surface);
      --panel-overlay: transparent;
      background-color: var(--panel-fill);
      background-image: linear-gradient(var(--panel-overlay), var(--panel-overlay));
      border: 2px solid var(--tecmo-white);
      box-shadow: 0 0 0 2px var(--tecmo-shadow), inset 0 0 0 1px rgba(255,255,255,0.15), 0 6px 18px rgba(0,0,0,0.25);
      transition: box-shadow 140ms ease, transform 140ms ease;
    }
    .panel-8bit:hover { box-shadow: 0 0 0 2px var(--tecmo-shadow), inset 0 0 0 1px rgba(255,255,255,0.12), 0 10px 24px rgba(0,0,0,0.32); }
    .panel-8bit.notice-error { --panel-overlay: rgba(228,0,88,0.28); }
    .panel-8bit.notice-warn { --panel-overlay: rgba(248,184,0,0.22); }
    .panel-8bit.notice-success { --panel-overlay: rgba(60,188,13,0.22); }
    .panel-8bit.notice-info { --panel-overlay: rgba(13,108,242,0.22); }
    .btn-8bit {
      border: 2px solid var(--tecmo-white);
      background-color: var(--tecmo-blue);
      color: var(--tecmo-white);
      box-shadow: 0 0 0 2px var(--tecmo-shadow), inset 0 -2px 0 0 var(--tecmo-shadow);
      transition: transform 80ms, filter 80ms;
    }
    .btn-8bit:hover { filter: brightness(1.05); }
    .btn-8bit:active { transform: translateY(1px); box-shadow: 0 0 0 2px var(--tecmo-shadow), inset 0 1px 0 0 var(--tecmo-shadow); }
    .btn-8bit:focus-visible { outline: 2px solid var(--tecmo-gold); outline-offset: 3px; }
    .btn-8bit.secondary {
      background-color: transparent;
      color: var(--tecmo-white);
      border-color: var(--tecmo-white);
    }
    .btn-8bit.warn { background-color: var(--tecmo-gold); color: #1b1400; }
    .btn-8bit.danger { background-color: var(--tecmo-red); }
    .pill-8bit {
      border: 2px solid var(--tecmo-white);
      padding: 6px 10px;
      background: transparent;
      color: var(--tecmo-white);
      box-shadow: 0 0 0 2px var(--tecmo-shadow), inset 0 0 0 1px rgba(255,255,255,0.15);
      text-transform: uppercase;
      font-size: 11px;
    }
    .pill-8bit:focus-visible { outline: 2px solid var(--tecmo-gold); outline-offset: 2px; }
    .pill-8bit.active { background: var(--tecmo-green); color: #021304; }
    .badge-8bit {
      display: inline-block;
      padding: 2px 6px;
      border: 2px solid var(--tecmo-white);
      box-shadow: 0 0 0 2px var(--tecmo-shadow), inset 0 0 0 1px rgba(255,255,255,0.15);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    .badge-pending { background: #1c233e; color: #b8c0ff; }
    .badge-win { background: var(--tecmo-green); color: #05250b; }
    .badge-lose { background: var(--tecmo-red); color: #ffe6ef; }
    .badge-push { background: var(--tecmo-gold); color: #1a1400; }
    .table-8bit th, .table-8bit td { border-top: 2px solid rgba(255,255,255,0.12); }
    .table-8bit thead th {
      background: linear-gradient(180deg, rgba(10,15,31,0.95), rgba(10,15,31,0.92));
      border-bottom: 2px solid rgba(255,255,255,0.18);
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(6px);
    }
    .table-8bit tbody tr:hover td { background: rgba(255,255,255,0.03); }
    .table-8bit td:first-child, .table-8bit th:first-child {
      position: sticky;
      left: 0;
      z-index: 15;
      background: linear-gradient(180deg, rgba(10,15,31,0.92), rgba(10,15,31,0.92));
      box-shadow: 4px 0 0 rgba(0,0,0,0.35);
    }
    .table-8bit thead th:first-child { z-index: 30; }
    .table-row-win { box-shadow: inset 4px 0 0 0 var(--tecmo-green); }
    .table-row-lose { box-shadow: inset 4px 0 0 0 var(--tecmo-red); }
    .table-row-push { box-shadow: inset 4px 0 0 0 var(--tecmo-gold); }
    .table-row-live { box-shadow: inset 4px 0 0 0 var(--tecmo-blue); }
    .table-row-win td:first-child { box-shadow: inset 6px 0 0 0 var(--tecmo-green); }
    .table-row-lose td:first-child { box-shadow: inset 6px 0 0 0 var(--tecmo-red); }
    .table-row-push td:first-child { box-shadow: inset 6px 0 0 0 var(--tecmo-gold); }
    .table-row-live td:first-child { box-shadow: inset 6px 0 0 0 var(--tecmo-blue); }
    /* Scoreboard */
    .scoreboard {
      border: 3px solid var(--tecmo-white);
      background-color: var(--tecmo-surface);
      box-shadow: 0 0 0 3px var(--tecmo-shadow), inset 0 0 0 2px rgba(255,255,255,0.12);
      color: var(--tecmo-white);
    }
    .kickoff { display: flex; align-items: center; gap: 6px; }
    .bulb {
      width: 12px; height: 12px; border: 2px solid var(--tecmo-white);
      border-radius: 50%;
      background: #1c233e;
      box-shadow: 0 0 0 2px var(--tecmo-shadow), inset 0 0 0 1px rgba(255,255,255,0.15);
      opacity: .4;
    }
    .is-live .bulb { animation: chase 1.1s linear infinite; opacity: .9; }
    .is-live .bulb:nth-child(1) { animation-delay: 0s; background: var(--tecmo-gold); }
    .is-live .bulb:nth-child(2) { animation-delay: .12s; background: var(--tecmo-gold); }
    .is-live .bulb:nth-child(3) { animation-delay: .24s; background: var(--tecmo-gold); }
    .is-live .bulb:nth-child(4) { animation-delay: .36s; background: var(--tecmo-gold); }
    .is-live .bulb:nth-child(5) { animation-delay: .48s; background: var(--tecmo-gold); }
    @keyframes chase {
      0%, 100% { filter: brightness(.9) drop-shadow(0 0 0 transparent); transform: translateY(0); }
      50% { filter: brightness(1.3) drop-shadow(0 0 6px rgba(248,184,0,.6)); transform: translateY(-1px); }
    }
    .progress-8bit { height: 14px; border: 2px solid var(--tecmo-white); box-shadow: 0 0 0 2px var(--tecmo-shadow), inset 0 0 0 1px rgba(255,255,255,0.15); }
    .progress-8bit .bar { height: 100%; background: linear-gradient(90deg, var(--tecmo-red), #f95c96); }
    .segmented-8bit { display: inline-flex; border: 2px solid var(--tecmo-white); overflow: hidden; box-shadow: 0 0 0 2px var(--tecmo-shadow); }
    .segmented-8bit button {
      background: #0e142a;
      color: var(--tecmo-white);
      border-right: 2px solid var(--tecmo-shadow);
      padding: 6px 10px;
      font-size: 11px;
      line-height: 1;
    }
    .segmented-8bit button:last-child { border-right: none; }
    .segmented-8bit button.active { background: var(--tecmo-blue); }
    .segmented-8bit button:focus-visible { outline: 2px solid var(--tecmo-gold); outline-offset: 2px; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border: 2px solid var(--tecmo-white);
      box-shadow: 0 0 0 2px var(--tecmo-shadow), inset 0 0 0 1px rgba(255,255,255,0.15);
      font-size: 11px;
      text-transform: uppercase;
      background: #0e142a;
    }
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border: 2px solid var(--tecmo-gold);
      background: rgba(248,184,0,0.12);
      box-shadow: 0 0 0 2px var(--tecmo-shadow);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .sticky-sync {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(8px);
      background: linear-gradient(180deg, rgba(11,16,33,0.92), rgba(11,16,33,0.82));
    }
    .table-scroll { max-height: 520px; overflow: auto; position: relative; }
    /* Inputs */
    .input-8bit, .select-8bit, .textarea-8bit {
      background: #0e142a; color: var(--tecmo-white);
      border: 2px solid var(--tecmo-white);
      box-shadow: 0 0 0 2px var(--tecmo-shadow), inset 0 0 0 1px rgba(255,255,255,0.15);
    }
    .helper-8bit { color: #9aa2b1; font-size: 11px; }
    @media (max-width: 480px) {
      .pixel-font { font-size: 11px; }
      .scoreboard .pixel-font { font-size: 10px; }
    }

    .prize-board { background:#080e18; border:4px solid #f8b800; box-shadow:0 0 0 4px #05070f,0 0 0 6px #48516a,8px 8px 0 #05070f; }
    .board-topline { display:flex; justify-content:space-between; gap:12px; padding:18px 22px; background:#18233a; border-bottom:3px solid #48516a; font-size:clamp(8px,1.1vw,12px); line-height:1.7; color:#d3dbea; }
    .board-prize { text-align:center; padding:36px 12px 30px; background:radial-gradient(circle,rgba(248,184,0,.11) 1px,transparent 1px); background-size:6px 6px; }
    .board-label { font-size:clamp(10px,1.4vw,14px); color:#b2bacb; letter-spacing:4px; }
    .prize-digits { font-size:clamp(28px,7.4vw,86px); line-height:1.4; color:#ffce40; text-shadow:4px 4px 0 #684500,0 0 28px #f8b80030; margin:18px 0; white-space:nowrap; }
    .board-tagline { font-size:clamp(8px,1.3vw,13px); color:#f5f7ff; letter-spacing:3px; line-height:1.8; }
    .board-counters { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); border-top:3px solid #48516a; }
    .board-counters>div { text-align:center; padding:18px 5px 12px; border-right:2px solid #28334a; }
    .board-counters>div:last-child { border-right:0; }
    .board-counters span { display:block; font-size:clamp(7px,1vw,11px); color:#9faac0; }
    .board-counters strong { display:block; font-size:clamp(34px,5vw,60px); line-height:1.2; font-weight:400; font-variant-numeric:tabular-nums; }
    .board-green { color:#80e65b; } .board-red { color:#ff657d; }
    .board-footer { display:flex; justify-content:space-between; gap:8px; padding:8px 16px; border-top:2px solid #28334a; color:#aebad0; font-size:16px; }
    @media(max-width:400px) { .board-topline { padding:12px 9px; gap:6px; } .board-label { letter-spacing:2px; } .board-tagline { letter-spacing:1px; } .board-footer { padding:8px; font-size:14px; } }
    /* Game-day layout: readable body copy, one status strip, roomy controls. */
    html { scroll-padding-top:110px; }
    .status-definition { font-size:14px; margin:-10px 0 20px; }
    .app-shell .team-chip { font:700 11px/1 system-ui,sans-serif; }
    body.tecmo { font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:16px; line-height:1.55; }
    .app-shell { max-width:1240px; margin:auto; padding:24px 20px 40px; }
    .app-shell h1,.app-shell h2,.app-shell h3,.app-shell p { margin:0; }
    .app-shell h1 { font-size:22px; line-height:1.7; color:#ffce40; }

    .app-shell p { color:#c1cbe0; }
    .app-shell .helper-8bit,.app-shell .source-line { font-family:inherit; font-size:14px; line-height:1.6; color:#c1cbe0; }
    .app-shell .text-xs,.app-shell .text-\[11px\] { font-size:14px; }
    button,input,select,textarea,summary { font:inherit; }
    .app-shell button,.app-shell select,.app-shell input:not([type=checkbox]),.app-shell summary { min-height:44px; }
    .app-shell button { padding:10px 14px; line-height:1.4; cursor:pointer; }

    .app-shell :focus-visible { outline:3px solid #ffce40; outline-offset:4px; }
    .app-shell [tabindex="-1"]:focus { outline:none; }
    .app-shell input:not([type=checkbox]),.app-shell select,.app-shell textarea { color:#f5f7ff; background:#111b30; border:1px solid #697790; border-radius:4px; padding:10px 12px; max-width:100%; }
    .app-shell input[type=checkbox] { width:22px; height:22px; accent-color:#f8b800; flex-shrink:0; }
    .app-shell select { min-width:130px; }
    .app-shell summary { cursor:pointer; padding:12px 0; font-weight:650; }
    .app-header,.week-toolbar,.section-heading { display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .app-header { margin-bottom:24px; flex-wrap:wrap; }

    .app-shell .board-tagline { font-family:inherit; font-size:15px; letter-spacing:.5px; }
    .status-strip { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); background:#080e18f5; border:1px solid #63738e; box-shadow:0 5px 14px #0005; position:sticky; top:0; z-index:20; margin:0 0 22px; backdrop-filter:blur(12px); }
    .status-strip>div { text-align:center; padding:9px 4px 5px; border-right:1px solid #33425c; }
